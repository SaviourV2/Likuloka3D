# Builds the web editor (web/) as a static site and publishes it on GitHub Pages.
# Pages must be switched on once: Settings, Pages, Source: GitHub Actions.
name: Deploy the web editor

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Install
        working-directory: web
        # the build type-checks the Cloud Function too, so its packages are needed
        run: npm ci --no-audit --no-fund && npm --prefix functions ci --no-audit --no-fund
      - name: Build
        working-directory: web
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npx next build && touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
